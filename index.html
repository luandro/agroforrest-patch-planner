
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroForrest - Planejamento Agroflorestal</title>
    <meta name="description" content="Aplicativo de planejamento para sistemas agroflorestais no Brasil" />
    <meta name="author" content="AgroForrest Team" />

    <meta property="og:title" content="AgroForrest - Planejamento Agroflorestal" />
    <meta property="og:description" content="Aplicativo de planejamento para sistemas agroflorestais no Brasil" />
    <meta property="og:type" content="website" />

    <script>
      // Single Page App GitHub Pages redirect handler
      // Decode the path from query parameter and restore it before React loads
      (function() {
        var l = window.location;
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            var path = q.p;
            // Restore search params if they were encoded
            var search = q.q ? ('?' + q.q) : '';
            history.replaceState(null, null,
              l.pathname.slice(0, -1) + path + search + l.hash
            );
          }
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
