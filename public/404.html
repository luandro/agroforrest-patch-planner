<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroForrest - Planejamento Agroflorestal</title>
    <meta name="description" content="Aplicativo de planejamento para sistemas agroflorestais no Brasil" />
    <meta name="author" content="AgroForrest Team" />

    <meta property="og:title" content="AgroForrest - Planejamento Agroflorestal" />
    <meta property="og:description" content="Aplicativo de planejamento para sistemas agroflorestais no Brasil" />
    <meta property="og:type" content="website" />

    <script>
      // GitHub Pages SPA 404 handler
      // Store the current path and redirect to index.html
      sessionStorage.setItem('redirect', location.pathname + location.search + location.hash);

      // Calculate the base path by removing everything after the repo name
      var pathSegments = location.pathname.split('/').filter(function(segment) { return segment; });
      var basePath = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';

      location.replace(location.origin + basePath);
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
