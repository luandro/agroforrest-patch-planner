<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroForrest - Planejamento Agroflorestal</title>
    <meta name="description" content="Aplicativo de planejamento para sistemas agroflorestais no Brasil" />
    <meta name="author" content="AgroForrest Team" />

    <meta property="og:title" content="AgroForrest - Planejamento Agroflorestal" />
    <meta property="og:description" content="Aplicativo de planejamento para sistemas agroflorestais no Brasil" />
    <meta property="og:type" content="website" />

    <script>
      // GitHub Pages SPA 404 handler
      // Redirect to index with the current path encoded as a query parameter
      (function() {
        var pathSegmentsToKeep = 1; // Number of path segments for repo name
        var l = window.location;
        var redirect = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');

        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') +
          '/?p=/' + redirect +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
